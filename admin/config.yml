# Decap CMS — edit your portfolio at https://YOUR-SITE.vercel.app/admin
# 1) Replace the YOUR-... values below (repo + site address), then push to GitHub.
# 2) Follow README.md to add the GitHub login keys in Vercel.
backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/YOUR-REPO-NAME
  branch: main
  base_url: https://YOUR-SITE.vercel.app
  auth_endpoint: api/auth

site_url: https://YOUR-SITE.vercel.app
display_url: https://YOUR-SITE.vercel.app
media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: Portfolio
    editor:
      preview: false
    files:
      - name: content
        label: Portfolio content
        file: content/site.json
        fields:
          - label: Contact
            name: contact
            widget: object
            collapsed: true
            fields:
              - label: Email (shown on the site; also used when no FormBold id is set)
                name: email
                widget: string
              - label: Instagram handle (without @)
                name: instagram
                widget: string
              - label: LinkedIn profile URL
                name: linkedin
                widget: string
              - label: Deliver enquiries straight to my inbox (FormSubmit, free)
                name: inbox_delivery
                widget: boolean
                default: true
              - label: FormSubmit private key (optional, hides your email; from the activation email)
                name: formsubmit_key
                widget: string
                required: false
              - label: FormBold form ID (optional, used instead of FormSubmit if set)
                name: formbold_id
                widget: string
                required: false

          - label: Projects (Selected work)
            name: projects
            widget: list
            summary: "{{fields.title}} — {{fields.type}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Type (small label), name: type, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Live URL, name: url, widget: string }
              - { label: Link text, name: link_label, widget: string, default: Visit live site }
              - label: Cursor label
                name: cursor
                widget: select
                options: [OPEN, PLAY, VIEW]
                default: OPEN
              - label: Built-in artwork (used when no screenshot is uploaded)
                name: art
                widget: select
                options: [horror, ghost, game, taj, none]
                default: none
              - label: Screenshot (optional, 16:10 looks best)
                name: image
                widget: image
                required: false

          - label: Posters & graphic design
            name: posters
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Kind (e.g. Poster, Brand visual), name: kind, widget: string }
              - { label: Image, name: image, widget: image }

          - label: Pricing (used by the estimate assistant)
            name: pricing
            widget: object
            collapsed: true
            fields:
              - { label: Currency symbol, name: currency, widget: string, default: "₹" }
              - { label: Show "From" prices on the rate cards, name: show_on_cards, widget: boolean, default: false }
              - { label: Urgent delivery multiplier, name: rush_multiplier, widget: number, value_type: float, default: 1.3 }
              - { label: Note shown under every estimate, name: terms, widget: text }
              - label: Services
                name: services
                widget: list
                summary: "{{fields.name}}: {{fields.from}} – {{fields.to}}"
                fields:
                  - label: Assistant key (do not change)
                    name: id
                    widget: select
                    options: [landing, site, scroll3d, webapp, ai, upgrade, design, motion]
                  - { label: Name, name: name, widget: string }
                  - { label: Price from, name: from, widget: number, value_type: int }
                  - { label: Price to, name: to, widget: number, value_type: int }
                  - { label: Pages included (0 if not page-based), name: pages, widget: number, value_type: int, default: 0 }
                  - { label: Typical timeline, name: days, widget: string }
              - label: Each extra page
                name: extra_page
                widget: object
                fields:
                  - { label: From, name: from, widget: number, value_type: int }
                  - { label: To, name: to, widget: number, value_type: int }
              - label: Add-ons
                name: addons
                widget: list
                summary: "{{fields.name}}: {{fields.from}} – {{fields.to}}"
                fields:
                  - label: Assistant key (do not change)
                    name: id
                    widget: select
                    options: [cms, forms, animations, threed, ecommerce, auth, database, chatbot, multilingual, seo]
                  - { label: Name, name: name, widget: string }
                  - { label: Price from, name: from, widget: number, value_type: int }
                  - { label: Price to, name: to, widget: number, value_type: int }
